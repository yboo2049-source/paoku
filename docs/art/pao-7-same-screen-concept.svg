      <rect x="960" y="857" width="207" height="38" rx="8" fill="#8C6BC4"/><text x="960" y="918">道具 · #8C6BC4</text>
      <rect x="1190" y="857" width="210" height="38" rx="8" fill="#9DC3D4"/><text x="1190" y="918">环境 · #9DC3D4</text>
