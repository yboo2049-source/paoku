    <text x="40" y="96" font-size="36" font-weight="700">晨光轨道 · 路线先于装饰</text>
    <rect x="1088" y="32" width="312" height="38" rx="19" fill="#E8E0F1"/>
    <text x="1244" y="57" text-anchor="middle" font-size="15" fill="#67518C">规划概念 v0.1 · 待评审</text>
    <text x="1400" y="102" text-anchor="end" font-size="13">2026-10-31 / 明亮风格化城市轨道</text>
  </g>
