  </g>
  <g font-family="Microsoft YaHei, sans-serif" fill="#243F4B">
    <!-- Sidebar is a review overlay, deliberately outside the concept viewport. -->
    <rect x="1100" y="140" width="300" height="658" rx="24" fill="#E9EDE6"/>
    <text x="1124" y="177" font-size="17" font-weight="700">同屏评审锚点</text>
    <text x="1124" y="210" font-size="13">01  暖色主角 / 冷色环境</text>
    <text x="1124" y="235" font-size="12" fill="#60767B">服装块面明确，四肢与脚底完整。</text>
    <path d="M1124 253H1376" stroke="#C9D5CF"/>
    <text x="1124" y="281" font-size="13">02  坡面 → 同高车顶</text>
    <text x="1124" y="306" font-size="12" fill="#60767B">斜面与侧面组成楔形，不用高盒体。</text>
    <path d="M1140 369L1250 337H1357V369Z" fill="#69BDA4" stroke="#438C79" stroke-width="2"/>
    <path d="M1250 337H1357V369H1250Z" fill="#397C87"/><path d="M1250 337H1357" stroke="#D6E9E1" stroke-width="5"/>
    <path d="M1140 383H1357" stroke="#849A9E" stroke-dasharray="4 4"/>
    <text x="1124" y="405" font-size="11" fill="#60767B">侧视原理 · 几何与支撑面须同源</text>
    <path d="M1124 425H1376" stroke="#C9D5CF"/>
    <text x="1124" y="454" font-size="13">03  颜色 + 形状双重语义</text>
    <use href="#coin" transform="translate(1142 491) scale(.7)"/>
    <path d="M1190 480V496Q1190 506 1201 506Q1212 506 1212 496V480" stroke="#8C6BC4" stroke-width="7" fill="none"/>
    <path d="M1241 493L1256 476L1271 493L1256 510Z" fill="#8C6BC4"/><text x="1256" y="497" text-anchor="middle" font-size="11" fill="#F7F3E9">×2</text>
    <path d="M1301 477L1313 479L1315 493L1330 500V508H1299L1296 499Z" fill="#8C6BC4"/>
    <path d="M1140 544Q1152 535 1179 544Q1189 550 1178 555H1145Q1134 553 1140 544Z" fill="#8C6BC4"/>
    <text x="1195" y="551" font-size="11" fill="#60767B">磁铁 / 倍分 / 跑鞋 / 滑板</text>
    <path d="M1124 574H1376" stroke="#C9D5CF"/>
    <text x="1124" y="603" font-size="13">04  柔和日光 / 克制发光</text>
    <text x="1124" y="628" font-size="12" fill="#60767B">玻璃与金属保留边界，不铺霓虹。</text>
    <text x="1124" y="672" font-size="13" font-weight="700">本图能评审</text>
    <text x="1124" y="697" font-size="12" fill="#60767B">色彩、轮廓、同屏层级、风格方向</text>
    <text x="1124" y="735" font-size="13" font-weight="700">仍须引擎验证</text>
    <text x="1124" y="760" font-size="12" fill="#60767B">脚底接触、遮挡、动作、性能、响应式</text>
    <text x="40" y="835" font-size="13" letter-spacing="2">六类色彩语义 / HEX 为待评审提案</text>
