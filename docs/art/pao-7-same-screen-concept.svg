<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">PAO-7 明亮城市轨道同屏风格概念 v0.1</title>
  <desc id="desc">原创矢量规划概念，展示珊瑚色跑者、青色完整列车、连接车顶的真实楔形坡道、三车道城市环境与HUD。非游戏截图，非3D资产，全部细节待评审。</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#DCECF0"/><stop offset="1" stop-color="#F7F3E9"/></linearGradient>
    <linearGradient id="railbed" x2="0" y2="1"><stop stop-color="#B8CBD0"/><stop offset="1" stop-color="#CDD4CD"/></linearGradient>
    <linearGradient id="train" x2="1" y2="0"><stop stop-color="#6FADB3"/><stop offset="1" stop-color="#397C87"/></linearGradient>
    <pattern id="hazard" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="20" height="20" fill="#F7F3E9"/><rect width="9" height="20" fill="#D94B4B"/></pattern>
    <clipPath id="scene"><rect x="40" y="140" width="1040" height="658" rx="24"/></clipPath>
    <g id="coin"><ellipse rx="13" ry="18" fill="#E4AD3F" stroke="#9C6B26" stroke-width="2"/><ellipse rx="8" ry="12" fill="#F8DB86"/><path d="M0 -7V7M-3 -5H2M-3 5H2" stroke="#9C6B26" stroke-width="2"/></g>
