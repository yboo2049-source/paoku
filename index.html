<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subway Surfer V1 (Harness)</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="game-container">
      <canvas id="game-canvas"></canvas>
      <div id="ui-layer">
        
        <!-- HUD Layer (Always visible during PLAYING) -->
        <div id="hud-layer" style="display: none;">
          <div id="score-board">
            <div class="hud-item score-item">
              <svg viewBox="0 0 24 24" class="icon"><path fill="currentColor" d="M12,2L1,21H23M12,6L19.53,19H4.47M11,10V14H13V10M11,16V18H13V16" /></svg>
              <span id="score">0</span>
            </div>
          </div>
          
          <!-- Speedometer -->
          <div id="speedometer-container">
            <div class="speed-label">SPEED</div>
            <div class="speed-bar-bg">
              <div id="speed-bar-fill"></div>
            </div>
          </div>
          
          <!-- Active Buffs -->
          <div id="buffs-container">
            <!-- Buffs injected here by JS -->
          </div>
        </div>

        <!-- Menu Screen -->
        <div id="menu-screen" class="screen animate-pop">
          <div class="game-logo">PAOKU</div>
          <div class="stats panel">
            <p><svg viewBox="0 0 24 24" class="icon-small"><path fill="currentColor" d="M12,17.27L18.18,21L16.54,13.97L22,9.24L14.81,8.62L12,2L9.19,8.62L2,9.24L7.45,13.97L5.82,21L12,17.27Z"/></svg> High Score: <span id="menu-high-score">0</span></p>
            <p><svg viewBox="0 0 24 24" class="icon-small"><path fill="currentColor" d="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4M11,16H13V18H11V16M12,6C13.66,6 15,7.34 15,9C15,10.66 14.12,11.53 13.06,12.44C12.33,13.08 12,13.67 12,14.5H12V15H10.5V14.5C10.5,13 11.5,12.18 12.44,11.36C13.19,10.71 13.5,10.27 13.5,9C13.5,8.17 12.83,7.5 12,7.5C11.17,7.5 10.5,8.17 10.5,9H9C9,7.34 10.34,6 12,6Z"/></svg> Coins: <span id="menu-total-coins">0</span></p>
          </div>
          <button id="start-btn" class="cyber-btn"><span class="btn-text">START RUN</span></button>
          <button id="open-shop-btn" class="cyber-btn secondary-btn"><span class="btn-text">SHOP</span></button>
          <button id="autopilot-btn" class="cyber-btn text-btn">AI Autopilot</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen animate-pop" style="display: none;">
          <h1 class="glitch-text">SYSTEM FAILURE</h1>
          <div class="stats panel">
            <p>Score: <span id="final-score">0</span></p>
          </div>
          <button id="restart-btn" class="cyber-btn"><span class="btn-text">REBOOT SYSTEM</span></button>
        </div>

        <!-- Shop Screen -->
        <div id="shop-screen" class="screen animate-pop" style="display: none;">
          <h1>Cyber Shop</h1>
          <div class="stats panel">
            <p>Credits: <span id="shop-total-coins">0</span></p>
          </div>
          <button id="buy-red-skin-btn" class="cyber-btn shop-btn">
            <span class="btn-text">Red Frame [100 ¢]</span>
          </button>
          <button id="close-shop-btn" class="cyber-btn secondary-btn" style="margin-top: 40px"><span class="btn-text">Back</span></button>
        </div>

        <!-- Paused Screen -->
        <div id="paused-screen" class="screen animate-pop" style="display: none;">
          <h1>PAUSED</h1>
          <p>Press ESC to Resume</p>
        </div>

        <pre id="debug-panel"></pre>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
