<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAO-15 四动作技术样本</title>
<style>*{box-sizing:border-box}body{margin:0;background:#dce8ee;color:#243f4b;font:15px/1.5 system-ui,sans-serif}main{height:100vh;display:grid;grid-template-columns:295px 1fr}aside{padding:22px;background:#f7f3e9;overflow:auto}h1{font-size:23px;line-height:1.3}p{margin:12px 0}button,select,input{font:inherit}button,select{padding:9px;margin:5px 0;width:100%;border:1px solid #879ba2;border-radius:7px;color:inherit;background:white}button{cursor:pointer}button:disabled,select:disabled{opacity:.45;cursor:default}#state{white-space:pre-line;min-height:105px}.notice{padding:10px;background:#f6dfb9;border-radius:7px}canvas{width:100%;height:100%;min-width:0;display:block;outline:none}label{display:block;margin-top:12px}input{width:100%}small{font-size:12px;color:#607780}@media(max-width:640px){main{grid-template-columns:1fr;grid-template-rows:280px 1fr}aside{padding:12px}h1{font-size:18px;margin:0}button,select{width:auto;padding:5px;margin:2px}.detail{display:none}#state{min-height:50px}label{margin-top:3px}}</style>
</head><body><main><aside><h1>Runner · 四动作样本</h1><p class="notice">本地骨关键帧技术样本<br>人工权重 / 接触精修待办</p><p id="state">正在加载…</p><select id="clip" aria-label="技术动作"></select><button id="play" disabled>从头播放</button><button id="pause" disabled>暂停</button><button id="resume" disabled>继续</button><label>局部时间（秒）<input id="time" type="range" min="0" max="2" step="0.01" value="0" disabled></label><button id="front">正面</button><button id="side">侧面</button><button id="rest">归位至绑定姿态</button><button id="dispose">释放样本</button><button id="reload">重新导入</button><p class="detail">m · Y向上 · +Z角色前<br>地面每格0.25m<br>红X / 绿Y / 蓝Z</p><small class="detail">Jump / Slide阶段仅外观演示。root不跳跃、不前进；片段结束不产生落地、滑铲结束或无敌。不是正式13动作。</small></aside><canvas id="view" aria-label="四动作独立三维预览"></canvas></main><script type="module" src="./preview.ts"></script></body></html>
