<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAO-15 本地绑定诊断</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8eef0;color:#243f4b;font:15px/1.5 system-ui,sans-serif}main{height:100vh;display:grid;grid-template-columns:290px 1fr}aside{padding:24px;overflow:auto;background:#f7f3e9}h1{font-size:23px;line-height:1.3}p{margin:12px 0}button,select{display:block;width:100%;padding:10px;margin:10px 0;font:inherit;border:1px solid #738a93;border-radius:7px;background:white;color:inherit}button{cursor:pointer}canvas{width:100%;height:100%;display:block;min-width:0;outline:none}small{display:block;color:#536d78}#state{white-space:pre-line}label{display:block;margin-top:20px}.notice{padding:10px;background:#f7ddbb;border-radius:6px}@media(max-width:640px){main{grid-template-columns:1fr;grid-template-rows:240px 1fr}aside{padding:12px}h1{font-size:18px;margin:0}button,select{display:inline-block;width:auto;margin:3px;padding:6px}p{margin:4px}label{margin-top:4px}.detail{display:none}}
</style></head><body><main><aside><h1>Runner · 骨骼诊断</h1><p class="notice">自动绑定技术试样<br>非正式角色 / 非正式动作</p><p id="state">正在导入…</p><label>诊断姿势<select id="pose"></select></label><button id="play">播放一次诊断序列</button><button id="front">正面 / 斜前方</button><button id="side">侧面</button><button id="dispose">释放试样</button><button id="reload">重新导入</button><p class="detail">地面标尺：每格 0.25m<br>红 X · 绿 Y · 蓝 Z（角色前）</p><small class="detail">几何距离自动权重；保留源网格与材质。肩、肘、髋、膝及组合姿态用于暴露问题。手工调权、拓扑和动作精修留待以后。</small></aside><canvas id="view" aria-label="runner诊断三维预览"></canvas></main><script type="module" src="./preview.ts"></script></body></html>
